<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!--
    SPAWN.md README hero — mirrors docs/ style ("paper, ink, one rust accent").
    Type: Source Serif 4 / Georgia (display), IBM Plex Mono (labels/tree).
    Adapts to GitHub dark mode via prefers-color-scheme.
    Claude character path lifted from video/storyboard.html (the promo video).
  -->
  <defs>
    <style>
      :root {
        --bg: #f6f2ea;
        --bg-alt: #efe9dd;
        --surface: #fdfbf6;
        --ink: #211d16;
        --ink-soft: #4c463a;
        --muted: #6e6656;
        --line: #d9d1c0;
        --accent: #b04a17;
        --code-bg: #2a251c;
        --code-ink: #efe7d8;
        --code-dim: #b3a88f;
        --eye: #191712;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191712;
          --bg-alt: #14110d;
          --surface: #211e17;
          --ink: #ece5d5;
          --ink-soft: #c9c0ad;
          --muted: #948b78;
          --line: #3a352a;
          --accent: #d97b3f;
          --code-bg: #100e0a;
          --code-ink: #e5dcc8;
          --code-dim: #7d745f;
          --eye: #191712;
        }
      }
      .bg       { fill: var(--bg); }
      .bgalt    { fill: var(--bg-alt); }
      .surface  { fill: var(--surface); }
      .codebg   { fill: var(--code-bg); }
      .dot      { fill: var(--line); }
      .stroke   { stroke: var(--line); }
      .display  { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; fill: var(--ink); }
      .mono     { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
      .sans     { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .eyebrow  { fill: var(--accent); font-size: 13px; letter-spacing: 2px; font-weight: 500; }
      .h1       { font-size: 54px; font-weight: 600; letter-spacing: -1.2px; }
      .lede     { fill: var(--ink-soft); font-size: 21px; }
      .note     { fill: var(--muted); font-size: 15px; }
      .cardtitle{ fill: var(--muted); font-size: 12px; }
      .tf       { fill: var(--accent); font-size: 13px; font-weight: 500; }
      .td       { fill: var(--code-dim); font-size: 12.5px; }
      .cardfoot { fill: var(--muted); font-size: 13px; }
      .brandmark{ fill: var(--accent); font-size: 26px; }
      .brandname{ fill: var(--ink); font-size: 18px; font-weight: 500; }
      .starfill { fill: var(--accent); }
      .eyefill  { fill: var(--eye); }
    </style>
  </defs>

  <!-- paper -->
  <rect class="bg" width="1280" height="640"/>

  <!-- top brand rule -->
  <line class="stroke" x1="72" y1="68" x2="1208" y2="68" stroke-width="1"/>
  <text class="mono brandmark" x="72" y="52">*</text>
  <text class="mono brandname" x="92" y="52">SPAWN.md</text>
  <text class="mono cardtitle" x="1208" y="52" text-anchor="end">github.com/0xprincess/SPAWN.md</text>

  <!-- ===== left column ===== -->
  <text class="mono eyebrow" x="72" y="150">A ZERO-DEPENDENCY STARTING POINT FOR</text>
  <text class="mono eyebrow" x="72" y="174">AGENTICALLY DEVELOPED SOFTWARE</text>

  <text class="display h1" x="72" y="248">Agents play.</text>
  <text class="display h1" x="72" y="314">You set the game rules.</text>

  <text class="display lede" x="72" y="382">A workflow template for projects where autonomous agents</text>
  <text class="display lede" x="72" y="414">write most of the code — and a human operator steers</text>
  <text class="display lede" x="72" y="446">through bounded grants, not step-by-step supervision.</text>

  <!-- note -->
  <line class="stroke" x1="72" y1="520" x2="600" y2="520" stroke-width="1"/>
  <text class="sans note" x="72" y="552">Extracted from a multi-month, benchmark-driven agentic project.</text>
  <text class="sans note" x="72" y="576">Every rule traces to a failure mode that occurred in practice.</text>

  <!-- ===== right column: repo-tree card ===== -->
  <g>
    <rect class="surface stroke" x="736" y="120" width="472" height="412" rx="6" stroke-width="1"/>
    <!-- card bar -->
    <rect class="bgalt" x="736" y="120" width="472" height="38" rx="6"/>
    <line class="stroke" x1="736" y1="158" x2="1208" y2="158" stroke-width="1"/>
    <circle class="dot" cx="758" cy="139" r="4.5"/>
    <circle class="dot" cx="774" cy="139" r="4.5"/>
    <circle class="dot" cx="790" cy="139" r="4.5"/>
    <text class="mono cardtitle" x="808" y="143">the whole template</text>
    <!-- code pane -->
    <rect class="codebg" x="736" y="158" width="472" height="330"/>
    <!-- file tree: rust filenames (leading), dim descriptions (following) -->
    <text class="mono">
      <tspan class="tf" x="760" y="190">WORKFLOW.md           </tspan><tspan class="td">the durable rules — copied verbatim</tspan>
      <tspan class="tf" x="760" dy="27">ADAPTATION.md         </tspan><tspan class="td">binding derivation guide</tspan>
      <tspan class="tf" x="760" dy="27">OVERVIEW.template.md  </tspan><tspan class="td">durable project vision</tspan>
      <tspan class="tf" x="760" dy="27">GOAL.template.md      </tspan><tspan class="td">per-mission charter for a fresh session</tspan>
      <tspan class="tf" x="760" dy="27">arch/                 </tspan><tspan class="td"></tspan>
      <tspan class="tf" x="760" dy="27">  proposals/          </tspan><tspan class="td">numbered design decisions</tspan>
      <tspan class="tf" x="760" dy="27">  conformance.json    </tspan><tspan class="td">machine-readable conformance map</tspan>
      <tspan class="tf" x="760" dy="27">experiments/          </tspan><tspan class="td">contact-with-reality records</tspan>
      <tspan class="tf" x="760" dy="27">governance/           </tspan><tspan class="td"></tspan>
      <tspan class="tf" x="760" dy="27">  CHARTER.template.md </tspan><tspan class="td">operator charter</tspan>
      <tspan class="tf" x="760" dy="27">  SELF-CORRECTION.md  </tspan><tspan class="td">failure playbook — copied verbatim</tspan>
    </text>
    <!-- footer -->
    <line class="stroke" x1="736" y1="488" x2="1208" y2="488" stroke-width="1"/>
    <text class="sans cardfoot" x="760" y="518">Markdown + one JSON seed. Instantiate, commit, then write product code.</text>
  </g>

  <!-- ===== Claude character (from the promo video's storyboard) ===== -->
  <!-- perched on the card's top-left corner -->
  <g transform="translate(684, 60) scale(0.78)">
    <path class="starfill" d="M75 10 L87 55 L130 40 L95 70 L135 95 L88 88 L90 135 L75 95 L60 135 L62 88 L15 95 L55 70 L20 40 L63 55 Z"/>
    <circle class="eyefill" cx="63" cy="72" r="5.5"/>
    <circle class="eyefill" cx="87" cy="72" r="5.5"/>
  </g>
</svg>
